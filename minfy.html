<!doctypehtml><html lang="en"><meta charset="UTF-8"><meta content="width=device-width,initial-scale=1"name="viewport"><style>*{margin:0;padding:0;box-sizing:border-box}body{overflow-x:hidden;user-select:none}#welcome-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;background-color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;opacity:1}.screen-fade-out{animation:pureFadeOut 1.5s ease-in-out forwards!important}@keyframes pureFadeOut{0%{opacity:1}100%{opacity:0}}.content-wrapper{text-align:center;padding:0 20px}.sub-text{font-size:12px;text-transform:uppercase;letter-spacing:5px;color:rgba(251,191,36,.4);margin-bottom:10px;font-family:sans-serif}.text-container{overflow:hidden;padding:10px 0}.welcome-title{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:70px;font-weight:700;background:linear-gradient(to bottom,#fde68a,#fbbf24,#d97706);-webkit-background-clip:text;-webkit-text-fill-color:transparent;transform:translateY(140%) rotate(6deg);opacity:0;filter:blur(8px);animation:textFlowUpKeyframe 1.8s cubic-bezier(.2,1,.3,1) forwards;animation-delay:.3s}@media (min-width:768px){.welcome-title{font-size:110px}}.tagline{color:#78716c;font-style:italic;font-size:13px;letter-spacing:3px;border-top:1px solid rgba(217,119,6,.2);padding-top:15px;margin-top:15px;max-w:260px;margin-left:auto;margin-right:auto;font-family:sans-serif}@keyframes textFlowUpKeyframe{0%{transform:translateY(140%) rotate(8deg);opacity:0;filter:blur(8px)}100%{transform:translateY(0) rotate(0);opacity:1;filter:blur(0)}}.particle{position:absolute;background:rgba(251,191,36,.25);border-radius:50%;animation:floatUp 8s infinite linear}@keyframes floatUp{0%{transform:translateY(105vh) translateX(0) scale(.8);opacity:0}50%{opacity:.5}100%{transform:translateY(-5vh) translateX(50px) scale(1.2);opacity:0}}</style><div id="welcome-screen"><div class="particle"style="width:8px;height:8px;left:15%"></div><div class="particle"style="width:12px;height:12px;left:45%;animation-duration:12s;animation-delay:2s"></div><div class="particle"style="width:6px;height:6px;left:75%;animation-duration:10s;animation-delay:4s"></div><div class="particle"style="width:10px;height:10px;left:85%;animation-duration:7s;animation-delay:1s"></div><div class="content-wrapper"><span class="sub-text">A Cordial</span><div class="text-container"><h1 class="welcome-title">Welcome</h1></div><p class="tagline">TO THE PREMIUM EXPERIENCE</div></div><script>window.addEventListener('DOMContentLoaded', () => {
            const welcomeScreen = document.getElementById('welcome-screen');

            // 4.5  screen is in full black 
            setTimeout(() => {
                // to hide the welcome screen slowly as a animation
                welcomeScreen.classList.add('screen-fade-out');
                
                
                setTimeout(() => {
                    welcomeScreen.remove(); 
                }, 1500);

            }, 4500);
        });</script>
